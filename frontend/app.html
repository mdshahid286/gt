<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fair AI Recruitment System &mdash; Panel</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .workspace {
            padding: 40px 0 80px 0;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
            align-items: start;
        }

        .panel {
            padding: 24px;
        }

        .panel h2 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .panel .sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .status-row {
            min-height: 20px;
            margin-top: 12px;
            font-size: 0.85rem;
        }

        .results-panel {
            min-height: 420px;
            padding: 30px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-faint);
        }

        .empty-state .glyph {
            font-size: 2.4rem;
            margin-bottom: 14px;
            opacity: 0.5;
        }

        .agent-results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .agent-result-card {
            padding: 18px;
        }

        @media (max-width: 900px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }

            .agent-results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="nav">
        <div class="nav-logo">⚖️ Fair Hiring</div>
        <div class="nav-links">
            <a href="index.html">&larr; Back to overview</a>
        </div>
    </nav>

    <section class="workspace container">
        <div class="workspace-grid">

            <div class="glass panel">
                <h2>Candidate input</h2>
                <div class="sub">Pick a sample, or write your own.</div>

                <div class="field">
                    <label for="sample-select">Sample resume</label>
                    <select id="sample-select">
                        <option value="">-- write your own --</option>
                    </select>
                </div>

                <div class="field">
                    <label for="job-description">Job description</label>
                    <textarea id="job-description" rows="6"></textarea>
                </div>

                <div class="field">
                    <label for="resume">Candidate resume</label>
                    <textarea id="resume" rows="12"></textarea>
                </div>

                <button class="btn btn-primary" id="run-btn" style="width:100%;justify-content:center;">
                    Run evaluation
                </button>
                <div class="status-row" id="status"></div>
            </div>

            <div class="glass results-panel">
                <div class="empty-state" id="empty-state">
                    <div class="glyph">&#9878;&#65039;</div>
                    <div>Pick a resume and click <strong>Run evaluation</strong> to see the panel deliberate.</div>
                </div>
                <div id="results" style="display:none;"></div>
            </div>

        </div>
    </section>

    <script type="module" src="js/app.js"></script>
</body>

</html>
