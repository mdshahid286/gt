<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fair AI Recruitment System — Evaluation Panel</title>
    <meta name="description" content="Upload a resume and let four independent AI agents negotiate a hire/reject decision via Nash Bargaining." />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        /* Page-specific tweaks */
        .workspace-grid {
            grid-template-columns: 390px 1fr;
        }

        .input-panel .divider {
            margin: 16px 0;
        }

        #tab-paste { display: none; }
        #tab-upload { display: block; }
    </style>
</head>

<body>

    <nav class="nav">
        <div class="nav-logo">
            <div class="logo-icon">⚖️</div>
            Fair Hiring
        </div>
        <div class="nav-links">
            <a href="batch.html">Batch mode</a>
            <a href="index.html">← Overview</a>
        </div>
    </nav>

    <section class="workspace container">
        <div class="workspace-grid">

            <!-- ── Left: Input panel ── -->
            <div class="card input-panel">
                <h2>Candidate input</h2>
                <div class="sub">Upload a resume file, paste text, or load a sample below.</div>

                <!-- Resume input tabs -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="upload" type="button">📄 Upload file</button>
                    <button class="tab-btn" data-tab="paste" type="button">✍️ Paste text</button>
                </div>

                <!-- Upload tab -->
                <div class="field" id="tab-upload">
                    <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Drop a resume file here or click to browse">
                        <span class="dz-icon">📄</span>
                        <strong>Drop a resume here</strong> or click to browse
                        <div class="dz-hint">.pdf &nbsp;·&nbsp; .docx &nbsp;·&nbsp; .txt</div>
                        <div class="filename-display" id="filename-display"></div>
                    </div>
                    <input type="file" id="file-input" accept=".pdf,.docx,.txt" aria-label="Upload resume file" />
                </div>

                <!-- Paste tab -->
                <div class="field" id="tab-paste">
                    <label for="resume">Candidate resume text</label>
                    <textarea id="resume" rows="11" placeholder="Paste resume text here…" aria-label="Resume text input"></textarea>
                </div>

                <div class="divider"></div>

                <!-- Sample selector -->
                <div class="field">
                    <label for="sample-select">Or load a sample candidate</label>
                    <select id="sample-select" aria-label="Select a sample resume">
                        <option value="">── none ──</option>
                    </select>
                </div>

                <!-- Job description -->
                <div class="field">
                    <label for="job-description">Job description</label>
                    <textarea id="job-description" rows="6" placeholder="Paste the job description here…" aria-label="Job description"></textarea>
                </div>

                <!-- Run button -->
                <button class="btn btn-primary" id="run-btn" style="width:100%;justify-content:center;" aria-label="Run evaluation">
                    Run evaluation
                </button>
                <div class="status-row" id="status" aria-live="polite"></div>
            </div>

            <!-- ── Right: Results panel ── -->
            <div class="card results-panel">
                <!-- Empty state -->
                <div class="empty-state" id="empty-state">
                    <span class="glyph">⚖️</span>
                    <p>Upload or paste a resume, then click <strong>Run evaluation</strong> to watch four agents deliberate and reach a verdict.</p>
                </div>

                <!-- Results (injected by results-view.js) -->
                <div id="results" style="display:none;"></div>
            </div>

        </div>
    </section>

    <script type="module" src="js/app.js"></script>

</body>
</html>
